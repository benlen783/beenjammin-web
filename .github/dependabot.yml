version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major upgrades need compatibility review and should not be bundled with
      # routine updates. This does not suppress Dependabot security updates.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
