<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title">
  <title id="title">BeenJammin</title>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.1176
                0 0 0 0 0.8431
                0 0 0 0 0.3765
                0 0 0 0.18 0"
        result="glowColor"
      />
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="24" cy="24" r="17" fill="#1ed760" filter="url(#glow)"/>
  <text
    x="23.4"
    y="31"
    fill="#031408"
    font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="20"
    font-weight="900"
    letter-spacing="-1.6"
    text-anchor="middle"
  >B</text>
</svg>
